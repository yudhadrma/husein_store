.bdg:empty{display:none}

.dts{flex:1 1 220px;font-size:.85em;line-height:1.4}
.dts b{display:block}
.dts span{color:#bbb}

.bn::after{content:"";position:absolute;inset:auto 0 0;height:45%;background:linear-gradient(transparent,#0f0f0f)}
.hero .w{position:relative;z-index:1;margin-top:-20px}
h1{font-size:clamp(26px,5.5vw,42px);line-height:1.2;margin:0 0 10px;max-width:640px;font-weight:800}
.hero p{max-width:520px;opacity:.9;margin:0 0 20px}
.cta{display:flex;flex-wrap:wrap;gap:10px}
.gold{background:#d0101a;color:#fff;border:0;padding:12px 24px;border-radius:99px;font-weight:800;cursor:pointer}
.wl{display:inline-flex;align-items:center;gap:8px;border:1.5px solid #25d366;color:#fff;padding:11px 20px;border-radius:99px;font-weight:700}
.wl svg{fill:#25d366}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0 14px}
.tl{background:var(--sf);color:var(--ink);border:2px solid var(--ln);border-radius:16px;padding:12px;text-align:start;cursor:pointer}
.tl.on{border-color:var(--br);background:var(--soft)}
.tl i{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:#0f0f0f;color:#fff;font:700 14px var(--fa),sans-serif;margin-bottom:8px}
.tl.on i{background:var(--br)}
.tl b{display:block;font-size:.92em;line-height:1.25}
.tl span{font-size:.74em;color:var(--mu)}
.fc{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}
.fc button{white-space:nowrap;border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:99px;padding:6px 16px;cursor:pointer;font-weight:600}
.fc .on{background:var(--br);border-color:var(--br);color:#fff}
.ph{text-align:center;color:var(--mu);padding:44px 16px;border:2px dashed var(--ln);border-radius:16px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;animation:sl .35s ease}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.grid{grid-template-columns:repeat(5,1fr);gap:14px}}
@keyframes sl{from{opacity:0;transform:translateX(var(--sx,28px))}}
.pgr{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:18px}
.pn{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.pn button{min-width:38px;height:38px;border-radius:10px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);cursor:pointer;font-weight:700}
.pn .on{background:var(--br);border-color:var(--br);color:#fff}
.pn button:disabled{opacity:.35;cursor:default}
[dir=rtl] .pn .ar{transform:scaleX(-1)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.cv{aspect-ratio:3/4;background:linear-gradient(150deg,var(--c1),var(--c2));color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:16px;position:relative;font-family:var(--fa),sans-serif}
.cv.e{--c1:#2a2a2a;--c2:#050505}.cv.t{--c1:#d0101a;--c2:#6e0007}.cv.a{--c1:#1d1d1d;--c2:#000}
.cv::before{content:"";position:absolute;inset:8px;border:1px solid rgba(255,255,255,.5);border-radius:10px}
.cv.a::before{border:2px solid #d0101a}
.cv b{font-size:1.25em;line-height:1.55;font-weight:700}
.cv small{font-size:.85em;opacity:.8}

/* Waktu shalat (metode Kemenag: Subuh 20°, Isya 18°, Ashar standar) dihitung langsung di browser */
